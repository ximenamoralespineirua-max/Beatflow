<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeatFlow - Iniciar Sesión</title>
    <link rel="stylesheet" href="../assets/estilos.css">
</head>
<body>

  <header>
        <h1>BeatFlow</h1>
        <nav>
            <ul>
                <li><a href="../inicio.html">Inicio</a></li>
                <li><a href="./novedades.html">Novedades</a></li>
                <li><a href="./planes.html">Planes</a></li>
                <li><a href="./biblioteca.html">Biblioteca</a></li>
                <li><a href="./login.html">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Iniciar sesión en BeatFlow</h2>
            <p>Accede a tu música y listas de reproducción favoritas en cualquier dispositivo.</p>
            
            <img src="../images/logo.jpeg" width="150" height="150" alt="Icono de cuenta BeatFlow">

            <form action="#" method="post">
                <div>
                    <label for="correo">Correo Electrónico o ID de Apple:</label>
                    <br>
                    <input type="email" id="correo" name="email" placeholder="ejemplo@correo.com" required>
                </div>
                <br>
                <div>
                    <label for="pass">Contraseña</label>
                    <br>
                    <input type="password" name="password" id="pass" required>
                </div>
                <br>
                <div>
                    <button type="submit">Iniciar Sesión</button>
                </div>
            </form>
        </section>

    </main>

  <footer>
    <p>&copy; 2026 BeatFlow  Inc. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
